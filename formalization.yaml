# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "revenue-equivalence-lean"
  description: >-
    A Lean formalization of Myerson's 1981 revenue equivalence theorem in a
    single-parameter Bayesian mechanism-design model with continuous real
    types. The formal result is RevenueEquivalence.Palomar.revenueEquivalence
    (X P1 P2 : ℝ → ℝ) (h1 : BIC X P1) (h2 : BIC X P2)
    (hU : interimUtility X P1 0 = interimUtility X P2 0) (t : ℝ)
    (ht : 0 ≤ t) : P1 t = P2 t: two Bayesian incentive-compatible mechanisms
    with the same interim allocation rule and the same interim utility at
    the reference type (type zero) charge the same interim payments at every
    nonnegative type. Types range over all of ℝ; there is no lowest type,
    and zero is only the normalization point for the payment identity.
    The envelope lemma RevenueEquivalence.Palomar.envelope_integral and the
    expected-revenue corollary RevenueEquivalence.Palomar.expectedRevenueEqual
    are proved alongside; the corollary requires both interim payment rules
    to be integrable with respect to the prior
    ((hInt1 : Integrable P1 μ) (hInt2 : Integrable P2 μ)), so its conclusion
    is an equality of finite expected revenues rather than a vacuous
    totalized-integral identity. The Palomar registry API search on 2026-10-01 for
    "revenue equivalence" returned zero entries; the queries "Myerson" and
    "auction" returned only different theorems (see related_formalizations
    note). These are dated, limited observations, not universal prior-art
    claims.
  authors: ["Arthur Freitas Ramos"]
  responsible_maintainers: ["Arthur Freitas Ramos"]
  license: "BSD-3-Clause"

sources:
  - title: "Optimal auction design"
    authors: ["Roger B. Myerson"]
    type: "article"
    location: "Mathematics of Operations Research 6(1), 58-73, 1981. https://doi.org/10.1287/moor.6.1.58"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Covers the revenue equivalence theorem: in the single-parameter
      quasi-linear model, two Bayesian incentive-compatible mechanisms with
      the same allocation rule and the same reference-type (type-zero) utility
      yield the same payments. The formalization proves
      RevenueEquivalence.Palomar.revenueEquivalence
      (X P1 P2 : ℝ → ℝ) (h1 : BIC X P1) (h2 : BIC X P2)
      (hU : interimUtility X P1 0 = interimUtility X P2 0) (t : ℝ)
      (ht : 0 ≤ t) : P1 t = P2 t, via the envelope identity
      RevenueEquivalence.Palomar.envelope_integral and the expected-payment
      corollary RevenueEquivalence.Palomar.expectedRevenueEqual. The proof
      here uses a Riemann-sum-free squeeze rather than Myerson's original
      integral argument.

related_formalizations: []

classification:
  arxiv: ["cs.GT", "econ.TH"]
  msc2020: ["91B26"]

status:
  scope: >-
    The exact main binders and statements, checked against the library, are
    RevenueEquivalence.Palomar.envelope_integral (X P : ℝ → ℝ)
    (hBIC : BIC X P) (t : ℝ) (ht : 0 ≤ t) :
    interimUtility X P t - interimUtility X P 0 = ∫ x in (0:ℝ)..t, X x;
    RevenueEquivalence.Palomar.revenueEquivalence (X P1 P2 : ℝ → ℝ)
    (h1 : BIC X P1) (h2 : BIC X P2)
    (hU : interimUtility X P1 0 = interimUtility X P2 0) (t : ℝ)
    (ht : 0 ≤ t) : P1 t = P2 t;
    RevenueEquivalence.Palomar.expectedRevenueEqual (X P1 P2 : ℝ → ℝ)
    (μ : Measure ℝ) (h1 : BIC X P1) (h2 : BIC X P2)
    (hU : interimUtility X P1 0 = interimUtility X P2 0)
    (hsupp : ∀ᵐ t ∂μ, 0 ≤ t)
    (hInt1 : Integrable P1 μ) (hInt2 : Integrable P2 μ) :
    expectedPayment P1 μ = expectedPayment P2 μ.
    The zero sorry counts refer to the library (Revenue/) and Solution.lean;
    Challenge.lean carries 3 deliberate sorries (the theorem placeholders)
    per the Palomar statement-surface format; its four definitions carry
    real bodies. Types are ℝ (continuous); there is no finiteness,
    independence, symmetry, or density assumption, and there is no lowest
    type: zero is the reference/normalization point for the payment
    identity. IIR is defined but is not
    a hypothesis of any comparator theorem. The Palomar registry API search
    on 2026-10-01 for "revenue equivalence" returned zero entries; "Myerson"
    returned PALOMAR-2026-09-26-000002 (Myerson–Satterthwaite, a different
    theorem) and "auction" returned PALOMAR-2026-10-01-000007
    (Bulow–Klemperer, a different theorem). These dated searches are not
    universal prior-art claims.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "RevenueEquivalence.Palomar.envelope_integral"
      file: "Solution.lean"
      description: >-
        (X P : ℝ → ℝ) (hBIC : BIC X P) (t : ℝ) (ht : 0 ≤ t) :
        interimUtility X P t - interimUtility X P 0
        = ∫ x in (0:ℝ)..t, X x.
        Under BIC, the utility change from type zero is the interval
        integral of the allocation rule. Proved by a Riemann-sum-free
        squeeze over a uniform n-partition.
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "RevenueEquivalence.Palomar.revenueEquivalence"
      file: "Solution.lean"
      description: >-
        (X P1 P2 : ℝ → ℝ) (h1 : BIC X P1) (h2 : BIC X P2)
        (hU : interimUtility X P1 0 = interimUtility X P2 0) (t : ℝ)
        (ht : 0 ≤ t) : P1 t = P2 t.
        Equal allocation rules and equal type-zero utility force equal
        interim payments at every nonnegative type. Applies the envelope
        lemma to both mechanisms.
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "RevenueEquivalence.Palomar.expectedRevenueEqual"
      file: "Solution.lean"
      description: >-
        (X P1 P2 : ℝ → ℝ) (μ : Measure ℝ) (h1 : BIC X P1) (h2 : BIC X P2)
        (hU : interimUtility X P1 0 = interimUtility X P2 0)
        (hsupp : ∀ᵐ t ∂μ, 0 ≤ t)
        (hInt1 : Integrable P1 μ) (hInt2 : Integrable P2 μ) :
        expectedPayment P1 μ = expectedPayment P2 μ.
        Equal finite ex ante expected payments under any prior supported on
        nonnegative types almost everywhere, for integrable payment rules,
        via pointwise payment equality and integral congruence. The
        integrability hypotheses are essential: Lean's Bochner integral is
        totalized, so without them the equality would also hold vacuously
        for nonintegrable payment rules.
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"

