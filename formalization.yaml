      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: >-
        Lean checks the implementation and the separate comparator
        environments. Every milestone was compiled and axiom-audited
        independently before commit. M6_AUDIT.md maps prose claims to exact
        declarations, binders, and non-Lean provenance where a claim is
        historical or administrative.
  spend_usd: "subscription-based"
  notes: >-
    AI assistance was used for the formalization and packaging. This
    milestone performed no Palomar submission or registration.

fidelity:
  divergences: >-
    Types are ℝ (continuous real numbers); the model is single-parameter
    with quasi-linear utility interimUtility X P t = t * X t - P t. BIC is
    interim Bayesian incentive compatibility:
    ∀ t r, t * X r - P r ≤ interimUtility X P t. There are no finiteness,
    independence, symmetry, or density assumptions, and no
    dominant-strategy requirement. The envelope lemma needs 0 ≤ t; the
    revenue equivalence theorem concludes pointwise payment equality
    P1 t = P2 t on nonnegative types from equal (not necessarily zero)
    reference-type (type-zero) utility. The expected-revenue corollary needs the prior
    supported on nonnegative types almost everywhere
    (∀ᵐ t ∂μ, 0 ≤ t) and both payment rules integrable with respect to the
    prior ((hInt1 : Integrable P1 μ) (hInt2 : Integrable P2 μ)), so its
    conclusion is an equality of finite expectations; it uses the Bochner
    integral
    expectedPayment P μ = ∫ t, P t ∂μ, which is totalized. IIR
    (∀ t, 0 ≤ interimUtility X P t) is defined but is not a hypothesis of
    any comparator theorem. The envelope proof is a Riemann-sum-free
    squeeze (uniform n-partition, telescoping sums, vanishing gap), not
    the textbook virtual-value integral argument. The formalization does
    not cover multi-parameter settings, correlated types beyond what a
    general prior μ allows, or optimal-auction characterization.

alignment:
  namespace: "RevenueEquivalence.Palomar"
  statements:
    - source: "Core model definitions"
      lean: "RevenueEquivalence.interimUtility; RevenueEquivalence.BIC; RevenueEquivalence.IIR; RevenueEquivalence.expectedPayment"
      module: "Revenue/Defs.lean"
      status: "defined"
      note: >-
        interimUtility (X P : ℝ → ℝ) (t : ℝ) : ℝ := t * X t - P t;
        BIC (X P : ℝ → ℝ) : Prop := ∀ t r, t * X r - P r
        ≤ interimUtility X P t; IIR (X P : ℝ → ℝ) : Prop :=
        ∀ t, 0 ≤ interimUtility X P t; expectedPayment (P : ℝ → ℝ)
        (μ : Measure ℝ) : ℝ := ∫ t, P t ∂μ. All four are genuine defs;
        Challenge.lean redeclares them with identical bodies.
    - source: "Envelope formula"
      lean: "RevenueEquivalence.Palomar.envelope_integral"
      module: "Solution.lean"
      status: "proved"
      note: >-
        (X P : ℝ → ℝ) (hBIC : BIC X P) (t : ℝ) (ht : 0 ≤ t) :
        interimUtility X P t - interimUtility X P 0
        = ∫ x in (0:ℝ)..t, X x.
        Applies RevenueEquivalence.envelope_integral from
        Revenue/Envelope.lean.
    - source: "Revenue equivalence"
      lean: "RevenueEquivalence.Palomar.revenueEquivalence"
      module: "Solution.lean"
      status: "proved"
      note: >-
        (X P1 P2 : ℝ → ℝ) (h1 : BIC X P1) (h2 : BIC X P2)
        (hU : interimUtility X P1 0 = interimUtility X P2 0) (t : ℝ)
        (ht : 0 ≤ t) : P1 t = P2 t.
        Applies RevenueEquivalence.revenueEquivalence from
        Revenue/Equivalence.lean, which uses the envelope lemma twice.
    - source: "Expected revenue equality"
      lean: "RevenueEquivalence.Palomar.expectedRevenueEqual"
      module: "Solution.lean"
      status: "proved"
      note: >-
        (X P1 P2 : ℝ → ℝ) (μ : Measure ℝ) (h1 : BIC X P1) (h2 : BIC X P2)
        (hU : interimUtility X P1 0 = interimUtility X P2 0)
        (hsupp : ∀ᵐ t ∂μ, 0 ≤ t)
        (hInt1 : Integrable P1 μ) (hInt2 : Integrable P2 μ) :
        expectedPayment P1 μ = expectedPayment P2 μ.
        Applies RevenueEquivalence.expectedRevenueEqual from
        Revenue/Equivalence.lean (filter_upwards gives a.e. payment equality;
        the difference of the payment rules vanishes a.e., and
        MeasureTheory.integral_sub splits its integral using the
        integrability hypotheses, with MeasureTheory.integral_eq_zero_of_ae
        identifying the difference integral as zero).

review:
  status: "self-assessed"
  reviewers: ["none"]
  notes: >-
    scripts/verify-palomar.sh checks required files, module headers,
    compilation, exactly three Challenge placeholders, no forbidden proof
    tokens, Challenge's Lean/Mathlib-only imports and source dependency
    allowlist, every comparator declaration and its kind in separate
    Challenge and Solution environments, all RevenueEquivalence
    declarations' permitted axioms, the official lake comparator stage, and
    whitespace. M6_AUDIT.md records the prose-versus-artifact audit. This
    is local verification, not registry review.

acknowledgements: >-
  Mathlib contributors and Roger B. Myerson for the source result.
